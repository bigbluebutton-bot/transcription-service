# docker-compose.yml (FINAL VERSION)

services:
  # --- MongoDB Services ---

  mongo1:
    image: mongo:8.0
    container_name: mongo1_dev
    restart: always
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo/keyfile --port 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./data/mongo1:/data/db
      # Mount the keyfile
      - ./data/mongo/keyfile:/etc/mongo/keyfile
    network_mode: host

  mongo2:
    image: mongo:8.0
    container_name: mongo2_dev
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo/keyfile --port 27018
    volumes:
      - ./data/mongo2:/data/db
      - ./data/mongo/keyfile:/etc/mongo/keyfile
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    network_mode: host

  mongo3:
    image: mongo:8.0
    container_name: mongo3_dev
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo/keyfile --port 27019
    volumes:
      - ./data/mongo3:/data/db
      - ./data/mongo/keyfile:/etc/mongo/keyfile
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    network_mode: host

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_dev
    restart: unless-stopped
    # ports:
    #   - "8081:8081"
    environment:
      # Updated URL with credentials from the .env file
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017,localhost:27018,localhost:27019/?replicaSet=rs0&authSource=admin
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    network_mode: host

  # --- Redis Services ---
  redis-1:
    image: redis:7.2-alpine
    container_name: redis_1_dev
    restart: unless-stopped
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-1:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

  redis-2:
    image: redis:7.2-alpine
    container_name: redis_2_dev
    restart: unless-stopped
    command: redis-server --port 6382 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-2:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

  redis-3:
    image: redis:7.2-alpine
    container_name: redis_3_dev
    restart: unless-stopped
    command: redis-server --port 6383 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-3:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

  redis-4:
    image: redis:7.2-alpine
    container_name: redis_4_dev
    restart: unless-stopped
    command: redis-server --port 6384 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-4:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

  redis-5:
    image: redis:7.2-alpine
    container_name: redis_5_dev
    restart: unless-stopped
    command: redis-server --port 6385 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-5:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

  redis-6:
    image: redis:7.2-alpine
    container_name: redis_6_dev
    restart: unless-stopped
    command: redis-server --port 6386 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ./data/redis-6:/data
      - ./data/redis/acl/users.acl:/usr/local/etc/redis/users.acl:ro
    network_mode: host

# Web UI for Redis
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    volumes:
      - ./data/redisinsight:/data
    ports:
      - "5540:5540"
    environment:
      - RI_APP_HOST=0.0.0.0
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6

# --- Network Definition ---
networks:
  dev-net:
    driver: bridge